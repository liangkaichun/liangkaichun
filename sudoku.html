<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>数独游戏</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Helvetica Neue", "PingFang SC", sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    max-width: 480px;
    width: 100%;
    margin: 16px;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: #333;
    margin-bottom: 16px;
  }
  /* Sudoku grid */
  .sudoku-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: #333;
    border: 3px solid #222;
  }
  .sudoku-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    width: 100%;
    height: 100%;
    background: #fff;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(16px, 5vw, 28px);
    font-weight: 500;
    color: #333;
    cursor: pointer;
    user-select: none;
    position: relative;
    background: #fff;
    transition: background 0.15s;
    /* Inner border for grid lines */
    border-right: 1px solid #bbb;
    border-bottom: 1px solid #bbb;
  }
  /* 3x3 box borders — thicker */
  .cell:nth-child(9n+9) { border-right: none; }
  .cell:nth-child(n+73) { border-bottom: none; }
  .cell:nth-child(3n) { border-right: 2px solid #555; }
  .cell:nth-child(3n+3):not(:nth-child(9n+9)) { border-right: 2px solid #555; }
  .cell:nth-child(n+19):nth-child(-n+27) { border-bottom: 2px solid #555; }
  .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #555; }
  /* thicker outer border */
  .cell:nth-child(-n+9) { border-top: none; }
  .cell:nth-child(9n+1) { border-left: none; }

  /* Cell states */
  .cell.given { color: #333; font-weight: 700; }
  .cell.user-input { color: #0066cc; font-weight: 500; }
  .cell.selected { background: #bbdefb !important; }
  .cell.highlighted { background: #e3f2fd; }
  .cell.same-number { background: #c8e6c9; }
  .cell.conflict { color: #d32f2f !important; }
  .cell.conflict-same { background: #ffcdd2; }
  .cell.error-anim { animation: shake 0.3s ease; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* Number pad */
  .number-pad {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 6px;
    margin-top: 16px;
  }
  .num-btn {
    aspect-ratio: 1;
    border: none;
    border-radius: 8px;
    background: #f0f0f0;
    font-size: clamp(18px, 5vw, 24px);
    font-weight: 600;
    color: #333;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .num-btn:active { transform: scale(0.92); }
  .num-btn:hover { background: #e0e0e0; }
  .num-btn.completed { color: #999; background: #f9f9f9; }
  .num-btn.erase-btn { background: #ffebee; color: #c62828; }
  .num-btn.erase-btn:hover { background: #ffcdd2; }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .controls button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #1976d2;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    touch-action: manipulation;
  }
  .controls button:active { transform: scale(0.97); }
  .controls .btn-new { background: #388e3c; }
  .controls .btn-new:hover { background: #2e7d32; }
  .controls .btn-check { background: #f57c00; }
  .controls .btn-check:hover { background: #e65100; }
  .controls .btn-hint { background: #7b1fa2; }
  .controls .btn-hint:hover { background: #6a1b9a; }

  /* Status */
  .status {
    text-align: center;
    font-size: 14px;
    color: #666;
    margin-top: 12px;
    min-height: 20px;
  }
  .status.success { color: #2e7d32; font-weight: 600; }
  .status.error { color: #c62828; }
  .status.info { color: #1565c0; }

  /* Difficulty selector */
  .difficulty {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .difficulty button {
    flex: 1;
    padding: 8px 0;
    border: 2px solid #ddd;
    border-radius: 8px;
    background: #fff;
    font-size: 14px;
    font-weight: 600;
    color: #666;
    cursor: pointer;
    transition: all 0.15s;
    touch-action: manipulation;
  }
  .difficulty button.active {
    border-color: #1976d2;
    color: #1976d2;
    background: #e3f2fd;
  }
  .difficulty button:active { transform: scale(0.96); }

  /* Fix: last column and row borders for 3x3 boxes */
  .cell[data-col="2"], .cell[data-col="5"] { border-right: 2px solid #555 !important; }
  .cell[data-row="2"], .cell[data-row="5"] { border-bottom: 2px solid #555 !important; }
</style>
</head>
<body>

<div class="container">
  <h1>数独</h1>

  <div class="difficulty">
    <button data-diff="beginner">入门</button>
    <button data-diff="easy" class="active">简单</button>
    <button data-diff="medium">中等</button>
    <button data-diff="hard">困难</button>
  </div>

  <div class="sudoku-wrapper">
    <div class="sudoku-grid" id="grid"></div>
  </div>

  <div class="number-pad" id="numberPad">
    <button class="num-btn" data-num="1">1</button>
    <button class="num-btn" data-num="2">2</button>
    <button class="num-btn" data-num="3">3</button>
    <button class="num-btn" data-num="4">4</button>
    <button class="num-btn" data-num="5">5</button>
    <button class="num-btn" data-num="6">6</button>
    <button class="num-btn" data-num="7">7</button>
    <button class="num-btn" data-num="8">8</button>
    <button class="num-btn" data-num="9">9</button>
  </div>

  <div class="controls">
    <button class="btn-new" id="newGameBtn">新游戏</button>
    <button class="btn-hint" id="hintBtn">提示</button>
    <button class="btn-check" id="checkBtn">检查</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
// ─── Puzzle Library ───────────────────────────────────────────────
// 预先生成的有效数独完整解，运行时根据难度挖空
const SOLVED_BOARDS = [
  // Board 1
  [
    5,3,4, 6,7,8, 9,1,2,
    6,7,2, 1,9,5, 3,4,8,
    1,9,8, 3,4,2, 5,6,7,
    8,5,9, 7,6,1, 4,2,3,
    4,2,6, 8,5,3, 7,9,1,
    7,1,3, 9,2,4, 8,5,6,
    9,6,1, 5,3,7, 2,8,4,
    2,8,7, 4,1,9, 6,3,5,
    3,4,5, 2,8,6, 1,7,9,
  ],
  // Board 2
  [
    1,2,3, 4,5,6, 7,8,9,
    4,5,6, 7,8,9, 1,2,3,
    7,8,9, 1,2,3, 4,5,6,
    2,3,1, 5,6,4, 8,9,7,
    5,6,4, 8,9,7, 2,3,1,
    8,9,7, 2,3,1, 5,6,4,
    3,1,2, 6,4,5, 9,7,8,
    6,4,5, 9,7,8, 3,1,2,
    9,7,8, 3,1,2, 6,4,5,
  ],
  // Board 3
  [
    2,7,6, 5,9,1, 3,8,4,
    9,3,5, 4,8,2, 7,1,6,
    8,1,4, 7,6,3, 2,9,5,
    6,4,1, 2,5,9, 8,3,7,
    3,9,7, 1,4,8, 5,6,2,
    5,2,8, 3,7,6, 9,4,1,
    1,6,3, 9,2,5, 4,7,8,
    7,8,2, 6,3,4, 1,5,9,
    4,5,9, 8,1,7, 6,2,3,
  ],
  // Board 4
  [
    4,3,5, 2,6,9, 7,8,1,
    6,8,2, 5,7,1, 4,9,3,
    1,9,7, 8,3,4, 5,6,2,
    8,2,6, 1,9,5, 3,4,7,
    3,7,4, 6,8,2, 9,1,5,
    9,5,1, 7,4,3, 6,2,8,
    5,1,9, 3,2,6, 8,7,4,
    2,4,8, 9,5,7, 1,3,6,
    7,6,3, 4,1,8, 2,5,9,
  ],
];

// 各难度要挖掉（清空）的格子数
const REMOVE_COUNTS = {
  beginner: 25,   // 56 given
  easy:     37,   // 44 given
  medium:   47,   // 34 given
  hard:     55,   // 26 given
};

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function isSolvedBoardValid(board) {
  for (let i = 0; i < 9; i++) {
    const row = new Set();
    const col = new Set();
    const box = new Set();
    for (let j = 0; j < 9; j++) {
      row.add(board[i * 9 + j]);
      col.add(board[j * 9 + i]);
      const boxRow = Math.floor(i / 3) * 3 + Math.floor(j / 3);
      const boxCol = (i % 3) * 3 + (j % 3);
      box.add(board[boxRow * 9 + boxCol]);
    }
    if (row.size !== 9 || col.size !== 9 || box.size !== 9) return false;
  }
  return true;
}

function generatePuzzle(diff) {
  const validBoards = SOLVED_BOARDS.filter(isSolvedBoardValid);
  if (validBoards.length === 0) throw new Error('No valid Sudoku boards available');

  const idx = Math.floor(Math.random() * validBoards.length);
  const solved = validBoards[idx];
  const board = [];
  for (let r = 0; r < 9; r++) board.push(solved.slice(r * 9, r * 9 + 9));

  const removeCount = REMOVE_COUNTS[diff];
  const positions = shuffleArray(Array.from({length: 81}, (_, i) => i));
  for (let k = 0; k < removeCount; k++) {
    const pos = positions[k];
    const r = Math.floor(pos / 9);
    const c = pos % 9;
    board[r][c] = 0;
  }
  const solution = [];
  for (let r = 0; r < 9; r++) solution.push(solved.slice(r * 9, r * 9 + 9));
  return { board, solution };
}

// ─── Game State ──────────────────────────────────────────────────
let grid = [];           // 9x9 current values (0 = empty)
let solution = [];       // 9x9 solution
let given = [];          // 9x9 boolean (true = pre-filled, not editable)
let selectedCell = null; // { row, col } or null
let difficulty = 'easy';
let statusEl = document.getElementById('status');
const gridEl = document.getElementById('grid');

// ─── Utility ─────────────────────────────────────────────────────
function cloneBoard(b) { return b.map(r => [...r]); }

function solveSudoku(board) {
  const b = cloneBoard(board);
  const empty = findEmpty(b);
  if (!empty) return b;
  const [r, c] = empty;
  for (let n = 1; n <= 9; n++) {
    if (isValid(b, r, c, n)) {
      b[r][c] = n;
      const result = solveSudoku(b);
      if (result) return result;
      b[r][c] = 0;
    }
  }
  return null;
}

function findEmpty(b) {
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++)
      if (b[r][c] === 0) return [r, c];
  return null;
}

function isValid(b, row, col, num) {
  for (let i = 0; i < 9; i++) {
    if (b[row][i] === num) return false;
    if (b[i][col] === num) return false;
  }
  const br = Math.floor(row / 3) * 3, bc = Math.floor(col / 3) * 3;
  for (let r = br; r < br + 3; r++)
    for (let c = bc; c < bc + 3; c++)
      if (b[r][c] === num) return false;
  return true;
}

function hasConflict(b, row, col) {
  const num = b[row][col];
  if (num === 0) return false;
  for (let i = 0; i < 9; i++) {
    if (i !== col && b[row][i] === num) return true;
    if (i !== row && b[i][col] === num) return true;
  }
  const br = Math.floor(row / 3) * 3, bc = Math.floor(col / 3) * 3;
  for (let r = br; r < br + 3; r++)
    for (let c = bc; c < bc + 3; c++)
      if ((r !== row || c !== col) && b[r][c] === num) return true;
  return false;
}

// ─── Rendering ────────────────────────────────────────────────────
function render() {
  gridEl.innerHTML = '';
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      const val = grid[r][c];
      if (val !== 0) {
        cell.textContent = val;
        if (given[r][c]) cell.classList.add('given');
        else cell.classList.add('user-input');
      }
      // Conflicts
      if (hasConflict(grid, r, c)) {
        cell.classList.add('conflict');
      }
      // Selected cell
      if (selectedCell && selectedCell.row === r && selectedCell.col === c) {
        cell.classList.add('selected');
      }
      // Highlight row/col/box
      if (selectedCell) {
        const sr = selectedCell.row, sc = selectedCell.col;
        if (r === sr || c === sc ||
            (Math.floor(r/3) === Math.floor(sr/3) && Math.floor(c/3) === Math.floor(sc/3))) {
          if (!(r === sr && c === sc)) cell.classList.add('highlighted');
        }
        // Same number highlight
        if (grid[r][c] !== 0 && grid[r][c] === grid[sr][sc] && !(r === sr && c === sc)) {
          cell.classList.add('same-number');
        }
      }
      // conflict background for same-number conflicts
      if (selectedCell && grid[r][c] !== 0 && grid[r][c] === grid[selectedCell.row][selectedCell.col] && hasConflict(grid, r, c)) {
        cell.classList.add('conflict-same');
      }
      cell.addEventListener('click', () => onCellClick(r, c));
      gridEl.appendChild(cell);
    }
  }
  // Update number pad — dim completed numbers
  const counts = Array(10).fill(0);
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++)
      if (grid[r][c] !== 0) counts[grid[r][c]]++;
  document.querySelectorAll('.num-btn[data-num]').forEach(btn => {
    const n = parseInt(btn.dataset.num);
    btn.classList.toggle('completed', counts[n] >= 9);
  });
}

// ─── Interaction ──────────────────────────────────────────────────
function onCellClick(row, col) {
  if (given[row][col]) {
    selectedCell = { row, col };
    render();
    return;
  }
  selectedCell = { row, col };
  render();
}

function placeNumber(num) {
  if (!selectedCell) return;
  const { row, col } = selectedCell;
  if (given[row][col]) return;
  grid[row][col] = num;
  render();
  checkWin();
}

function eraseNumber() {
  if (!selectedCell) return;
  const { row, col } = selectedCell;
  if (given[row][col]) return;
  grid[row][col] = 0;
  render();
}

function checkWin() {
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++)
      if (grid[r][c] === 0 || hasConflict(grid, r, c)) return;
  setStatus('🎉 恭喜完成！太棒了！', 'success');
  // Add erase button functionality
}

function giveHint() {
  if (!selectedCell) {
    // Find first empty cell
    for (let r = 0; r < 9; r++)
      for (let c = 0; c < 9; c++)
        if (grid[r][c] === 0) { selectedCell = { row: r, col: c }; break; }
    if (!selectedCell) { setStatus('已经全部填完啦！', 'info'); return; }
  }
  const { row, col } = selectedCell;
  if (given[row][col]) { setStatus('这个格子是给定的，不能提示哦', 'info'); return; }
  if (grid[row][col] === solution[row][col]) { setStatus('这个格子已经对了', 'info'); return; }
  grid[row][col] = solution[row][col];
  render();
  setStatus(`提示：R${row+1}C${col+1} = ${solution[row][col]}`, 'info');
  checkWin();
}

function checkConflicts() {
  let hasError = false;
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] !== 0 && hasConflict(grid, r, c)) {
        hasError = true;
        // Flash the conflicting cells
        const idx = r * 9 + c;
        const el = gridEl.children[idx];
        if (el) el.classList.add('error-anim');
      }
    }
  }
  if (hasError) setStatus('发现冲突！红色格子有重复数字', 'error');
  else setStatus('目前没有发现冲突 ✅', 'success');
  setTimeout(() => render(), 350);
}

function setStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (type ? ' ' + type : '');
}

// ─── New Game ────────────────────────────────────────────────────
function newGame(diff) {
  difficulty = diff || difficulty;
  const { board, solution: sol } = generatePuzzle(difficulty);
  grid = board;
  solution = sol;
  given = grid.map(row => row.map(v => v !== 0));
  selectedCell = null;
  setStatus(`难度：${diffMap[difficulty]}`, 'info');
  render();
}

const diffMap = { beginner: '入门', easy: '简单', medium: '中等', hard: '困难' };

// ─── Keyboard support ────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '9') placeNumber(parseInt(e.key));
  if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') eraseNumber();
  if (e.key === 'ArrowUp' && selectedCell && selectedCell.row > 0) {
    selectedCell.row--; render();
  }
  if (e.key === 'ArrowDown' && selectedCell && selectedCell.row < 8) {
    selectedCell.row++; render();
  }
  if (e.key === 'ArrowLeft' && selectedCell && selectedCell.col > 0) {
    selectedCell.col--; render();
  }
  if (e.key === 'ArrowRight' && selectedCell && selectedCell.col < 8) {
    selectedCell.col++; render();
  }
});

// ─── Event bindings ──────────────────────────────────────────────
document.querySelectorAll('.num-btn[data-num]').forEach(btn => {
  btn.addEventListener('click', () => placeNumber(parseInt(btn.dataset.num)));
});

// Erase button — add dynamically to number pad
const eraseBtn = document.createElement('button');
eraseBtn.className = 'num-btn erase-btn';
eraseBtn.textContent = '✕';
eraseBtn.addEventListener('click', eraseNumber);
document.getElementById('numberPad').appendChild(eraseBtn);

document.querySelectorAll('.difficulty button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.difficulty button.active').classList.remove('active');
    btn.classList.add('active');
    newGame(btn.dataset.diff);
  });
});

document.getElementById('newGameBtn').addEventListener('click', () => newGame());
document.getElementById('hintBtn').addEventListener('click', giveHint);
document.getElementById('checkBtn').addEventListener('click', checkConflicts);

// ─── Start ───────────────────────────────────────────────────────
newGame('easy');
</script>
</body>
</html>
