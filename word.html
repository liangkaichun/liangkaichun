        // 解析CSV数据
        function parseCSV(csv) {
            const lines = csv.split('\n');
            const result = [];
            const headers = lines[0].split(',').map(header => header.trim());
            
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim() === '') continue;
                
                const currentline = lines[i].split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
                const item = {};
                
                for (let j = 0; j < headers.length; j++) {
                    item[headers[j]] = currentline[j] ? currentline[j].trim().replace(/^"/, '').replace(/"$/, '') : '';
                }
                
                result.push(item);
            }
            
            return result;
        }

        const words = parseCSV(vocabularyData);

    <!-- 应用状态管理 -->
    <script>
        class VocabularyApp {
            constructor() {
                this.currentSession = null;
                this.speechSynthesis = window.speechSynthesis;
                this.currentUtterance = null;
                this.loadSession();
                this.initializeEventListeners();
                this.setupMobileOptimizations();
            }

            // 初始化事件监听器
            initializeEventListeners() {
                // 开始学习按钮
                document.getElementById('startBtn').addEventListener('click', () => this.startLearning());
                
                // 已会按钮
                document.getElementById('knowBtn').addEventListener('click', () => this.markAsKnown());
                
                // 不会按钮
                document.getElementById('unknownBtn').addEventListener('click', () => this.markAsUnknown());
                
                // 重新开始按钮
                document.getElementById('restartBtn').addEventListener('click', () => this.restart());
                
                // 返回主页按钮
                document.getElementById('backHomeBtn').addEventListener('click', () => this.backToHome());
                document.getElementById('backHomeBtn2').addEventListener('click', () => this.backToHome());
                
                // 数量选择变化
                document.getElementById('wordCount').addEventListener('input', (e) => {
                    const count = parseInt(e.target.value);
                    document.getElementById('wordCountDisplay').textContent = count;
                });
                
                // 单词发音按钮
                document.getElementById('pronounceWordBtn').addEventListener('click', () => this.pronounceCurrentWord());
                
                // 例句发音按钮
                document.getElementById('pronounceExampleBtn').addEventListener('click', () => this.pronounceCurrentExample());
            }

            // 手机端优化设置
            setupMobileOptimizations() {
                // 防止页面缩放
                document.addEventListener('touchmove', function(e) {
                    e.preventDefault();
                }, { passive: false });
                
                // 点击延迟优化
                if ('touchAction' in document.documentElement.style) {
                    document.documentElement.style.touchAction = 'manipulation';
                }
                
                // 键盘事件监听
                document.addEventListener('keydown', (e) => {
                    if (document.getElementById('learningView').classList.contains('hidden')) return;
                    
                    switch(e.key) {
                        case 'ArrowLeft':
                            this.markAsKnown();
                            break;
                        case 'ArrowRight':
                            this.markAsUnknown();
                            break;
                        case 'w':
                        case 'W':
                            e.preventDefault();
                            this.pronounceCurrentWord();
                            break;
                        case 'e':
                        case 'E':
                            e.preventDefault();
                            this.pronounceCurrentExample();
                            break;
                        case ' ':
                            e.preventDefault();
                            // 空格键默认发音单词
                            this.pronounceCurrentWord();
                            break;
                    }
                });
            }

            // 开始学习
            startLearning() {
                const wordCount = parseInt(document.getElementById('wordCount').value);
                
                if (wordCount < 5 || wordCount > 50) {
                    this.showNotification('请选择5-50个单词！', 'error');
                    return;
                }

                // 随机选择单词
                const selectedWords = this.selectRandomWords(wordCount);
                
                this.currentSession = {
                    words: selectedWords,
                    knownWords: [],
                    unknownWords: [],
                    currentIndex: 0,
                    totalCount: wordCount,
                    completedCount: 0,
                    startTime: new Date().getTime()
                };

                this.saveSession();
                this.showLearningView();
                this.displayCurrentWord();
            }

            // 随机选择单词
            selectRandomWords(count) {
                const shuffled = [...words].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, count);
            }

            // 显示当前单词
            displayCurrentWord() {
                if (this.currentSession.currentIndex >= this.currentSession.words.length && 
                    this.currentSession.unknownWords.length === 0) {
                    this.completeLearning();
                    return;
                }

                let currentWord;
                
                // 如果有不会的单词，优先显示它们
                if (this.currentSession.unknownWords.length > 0 && Math.random() < 0.4) {
                    const randomIndex = Math.floor(Math.random() * this.currentSession.unknownWords.length);
                    currentWord = this.currentSession.unknownWords[randomIndex];
                } else {
                    // 显示新单词
                    if (this.currentSession.currentIndex < this.currentSession.words.length) {
                        currentWord = this.currentSession.words[this.currentSession.currentIndex];
                    } else {
                        // 所有新单词都显示过了，显示不会的单词
                        currentWord = this.currentSession.unknownWords[0];
                    }
                }

                const card = document.getElementById('wordCard');
                card.className = 'word-card bg-white rounded-3xl p-6 md:p-8 card-shadow animate-slide-in';

                const wordElement = document.getElementById('currentWord');
                const phoneticElement = document.getElementById('phonetic');
                const meaningElement = document.getElementById('meaning');
                const exampleElement = document.getElementById('example');
                const translationElement = document.getElementById('translation');
                const progressElement = document.getElementById('progressText');
                const progressBar = document.getElementById('progressBar');

                wordElement.textContent = currentWord.单词;
                phoneticElement.textContent = currentWord.音标;
                meaningElement.textContent = currentWord.含义;
                exampleElement.textContent = currentWord.例句;
                translationElement.textContent = currentWord.例句中文翻译;

                // 更新进度
                const progress = (this.currentSession.completedCount / this.currentSession.totalCount) * 100;
                progressElement.textContent = `${this.currentSession.completedCount}/${this.currentSession.totalCount}`;
                progressBar.style.width = `${progress}%`;

                // 添加动画效果
                setTimeout(() => {
                    card.classList.add('animate-bounce-gentle');
                }, 100);

                // 卡片切换后自动发音单词（延迟1秒，让动画完成）
                setTimeout(() => {
                    this.pronounceCurrentWord();
                }, 1000);
            }

            // 停止当前发音
            stopCurrentSpeech() {
                if (this.currentUtterance) {
                    this.speechSynthesis.cancel();
                    this.currentUtterance = null;
                }
                
                // 重置发音按钮状态
                const wordBtn = document.getElementById('pronounceWordBtn');
                const exampleBtn = document.getElementById('pronounceExampleBtn');
                
                wordBtn.classList.remove('speaking');
                wordBtn.innerHTML = '<i class="fa fa-volume-off text-2xl"></i>';
                
                exampleBtn.classList.remove('speaking');
                exampleBtn.innerHTML = '<i class="fa fa-volume-off text-xl"></i>';
            }

            // 单词发音功能
            pronounceCurrentWord() {
                if (!this.speechSynthesis) {
                    this.showNotification('您的浏览器不支持语音功能！', 'error');
                    return;
                }

                const word = document.getElementById('currentWord').textContent;
                const btn = document.getElementById('pronounceWordBtn');
                
                // 停止当前发音
                this.stopCurrentSpeech();
                
                // 创建发音请求
                this.currentUtterance = new SpeechSynthesisUtterance(word);
                this.currentUtterance.lang = 'en-US';
                this.currentUtterance.rate = 0.7;
                this.currentUtterance.pitch = 1.1;
                
                // 添加发音效果
                btn.classList.add('speaking');
                btn.innerHTML = '<i class="fa fa-volume-up text-2xl"></i>';
                
                this.currentUtterance.onend = () => {
                    btn.classList.remove('speaking');
                    btn.innerHTML = '<i class="fa fa-volume-off text-2xl"></i>';
                    this.currentUtterance = null;
                };
                
                this.speechSynthesis.speak(this.currentUtterance);
            }

            // 例句发音功能
            pronounceCurrentExample() {
                if (!this.speechSynthesis) {
                    this.showNotification('您的浏览器不支持语音功能！', 'error');
                    return;
                }

                const example = document.getElementById('example').textContent;
                const btn = document.getElementById('pronounceExampleBtn');
                
                // 停止当前发音
                this.stopCurrentSpeech();
                
                // 创建发音请求
                this.currentUtterance = new SpeechSynthesisUtterance(example);
                this.currentUtterance.lang = 'en-US';
                this.currentUtterance.rate = 0.9;
                this.currentUtterance.pitch = 1.0;
                
                // 添加发音效果
                btn.classList.add('speaking');
                btn.innerHTML = '<i class="fa fa-volume-up text-xl"></i>';
                
                this.currentUtterance.onend = () => {
                    btn.classList.remove('speaking');
                    btn.innerHTML = '<i class="fa fa-volume-off text-xl"></i>';
                    this.currentUtterance = null;
                };
                
                this.speechSynthesis.speak(this.currentUtterance);
            }

            // 标记为已会
            markAsKnown() {
                const currentWord = this.getCurrentWord();
                
                // 停止当前发音
                this.stopCurrentSpeech();
                
                // 从不会的单词列表中移除
                this.currentSession.unknownWords = this.currentSession.unknownWords.filter(
                    word => word.单词 !== currentWord.单词
                );

                // 如果是新单词，增加完成计数
                if (this.currentSession.currentIndex < this.currentSession.words.length) {
                    this.currentSession.completedCount++;
                }

                this.currentSession.currentIndex++;
                this.saveSession();
                this.flipCard('know');
            }

            // 标记为不会
            markAsUnknown() {
                const currentWord = this.getCurrentWord();
                
                // 停止当前发音
                this.stopCurrentSpeech();
                
                // 如果不在不会的列表中，添加进去
                const isInUnknown = this.currentSession.unknownWords.some(
                    word => word.单词 === currentWord.单词
                );
                
                if (!isInUnknown) {
                    this.currentSession.unknownWords.push(currentWord);
                }

                // 如果是新单词，增加完成计数
                if (this.currentSession.currentIndex < this.currentSession.words.length) {
                    this.currentSession.completedCount++;
                }

                this.currentSession.currentIndex++;
                this.saveSession();
                this.flipCard('unknown');
            }

            // 获取当前显示的单词
            getCurrentWord() {
                const currentWordText = document.getElementById('currentWord').textContent;
                return this.currentSession.words.find(word => word.单词 === currentWordText) ||
                       this.currentSession.unknownWords.find(word => word.单词 === currentWordText);
            }

            // 卡片翻转效果
            flipCard(result) {
                const card = document.getElementById('wordCard');
                card.style.animation = 'flip 0.6s ease-in-out';
                
                setTimeout(() => {
                    if (result === 'know') {
                        card.style.backgroundColor = '#dcfce7';
                        card.style.border = '2px solid #22C55E';
                    } else {
                        card.style.backgroundColor = '#fef2f2';
                        card.style.border = '2px solid #EF4444';
                    }
                    
                    setTimeout(() => {
                        card.style.backgroundColor = '';
                        card.style.border = '';
                        this.displayCurrentWord();
                    }, 300);
                }, 300);
            }

            // 完成学习
            completeLearning() {
                const endTime = new Date().getTime();
                const duration = Math.floor((endTime - this.currentSession.startTime) / 1000);
                
                const summary = {
                    total: this.currentSession.totalCount,
                    known: this.currentSession.totalCount - this.currentSession.unknownWords.length,
                    unknown: this.currentSession.unknownWords.length,
                    duration: duration,
                    date: new Date().toLocaleDateString()
                };

                // 保存学习记录
                this.saveLearningRecord(summary);
                
                // 显示完成页面
                this.showCompletionView(summary);
                
                // 清除当前会话
                this.currentSession = null;
                this.saveSession();
            }

            // 显示完成页面
            showCompletionView(summary) {
                document.getElementById('homeView').classList.add('hidden');
                document.getElementById('learningView').classList.add('hidden');
                document.getElementById('completionView').classList.remove('hidden');

                document.getElementById('totalWords').textContent = summary.total;
                document.getElementById('knownWords').textContent = summary.known;
                document.getElementById('unknownWords').textContent = summary.unknown;
                document.getElementById('accuracy').textContent = Math.round((summary.known / summary.total) * 100);
                document.getElementById('timeSpent').textContent = `${Math.floor(summary.duration / 60)}分${summary.duration % 60}秒`;

                // 显示不会的单词列表
                const unknownList = document.getElementById('unknownWordsList');
                unknownList.innerHTML = '';
                
                this.currentSession.unknownWords.forEach(word => {
                    const li = document.createElement('li');
                    li.className = 'flex justify-between items-center p-3 bg-red-50 rounded-lg mb-2 border-l-4 border-red-400';
                    li.innerHTML = `
                        <div class="flex-1">
                            <div class="font-bold text-lg">${word.单词}</div>
                            <div class="text-sm text-gray-600">${word.含义}</div>
                        </div>
                        <div class="flex space-x-1">
                            <button onclick="app.pronounceWord('${word.单词}')" 
                                    class="p-2 text-blue-500 hover:text-blue-700 rounded-full hover:bg-blue-50 transition-colors">
                                <i class="fa fa-volume-off"></i>
                            </button>
                        </div>
                    `;
                    unknownList.appendChild(li);
                });

                // 添加成就动画
                setTimeout(() => {
                    document.querySelector('#completionView .animate-bounce-gentle').classList.add('animate-bounce-gentle');
                }, 500);
            }

            // 重新开始
            restart() {
                this.currentSession = null;
                this.saveSession();
                this.backToHome();
            }

            // 返回主页
            backToHome() {
                document.getElementById('homeView').classList.remove('hidden');
                document.getElementById('learningView').classList.add('hidden');
                document.getElementById('completionView').classList.add('hidden');
                
                // 停止当前发音
                this.stopCurrentSpeech();
                
                // 重置进度条
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').textContent = '0/0';
            }

            // 显示学习界面
            showLearningView() {
                document.getElementById('homeView').classList.add('hidden');
                document.getElementById('learningView').classList.remove('hidden');
                document.getElementById('completionView').classList.add('hidden');
            }

            // 保存会话
            saveSession() {
                localStorage.setItem('vocabularySession', JSON.stringify(this.currentSession));
            }

            // 加载会话
            loadSession() {
                const saved = localStorage.getItem('vocabularySession');
                if (saved) {
                    this.currentSession = JSON.parse(saved);
                    
                    // 如果有未完成的会话，询问用户是否继续
                    if (this.currentSession && this.currentSession.currentIndex < this.currentSession.totalCount) {
                        if (confirm('发现未完成的学习会话，是否继续？')) {
                            this.showLearningView();
                            this.displayCurrentWord();
                        } else {
                            this.currentSession = null;
                            this.saveSession();
                        }
                    }
                }
            }

            // 保存学习记录
            saveLearningRecord(summary) {
                const records = this.getLearningRecords();
                records.push(summary);
                
                // 只保留最近30条记录
                if (records.length > 30) {
                    records.splice(0, records.length - 30);
                }
                
                localStorage.setItem('vocabularyRecords', JSON.stringify(records));
            }

            // 获取学习记录
            getLearningRecords() {
                const saved = localStorage.getItem('vocabularyRecords');
                return saved ? JSON.parse(saved) : [];
            }

            // 显示通知
            showNotification(message, type = 'info') {
                const notification = document.createElement('div');
                notification.className = `fixed top-4 left-4 right-4 px-6 py-4 rounded-xl shadow-lg z-50 animate-slide-in ${
                    type === 'error' ? 'bg-red-500 text-white' : 
                    type === 'success' ? 'bg-green-500 text-white' : 
                    'bg-blue-500 text-white'
                }`;
                notification.textContent = message;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.style.opacity = '0';
                    notification.style.transform = 'translateY(-50px)';
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 3000);
            }

            // 单独发音功能（供完成页面使用）
            pronounceWord(word) {
                if (!this.speechSynthesis) return;
                
                this.stopCurrentSpeech();
                this.currentUtterance = new SpeechSynthesisUtterance(word);
                this.currentUtterance.lang = 'en-US';
                this.currentUtterance.rate = 0.7;
                
                this.currentUtterance.onend = () => {
                    this.currentUtterance = null;
                };
                
                this.speechSynthesis.speak(this.currentUtterance);
            }
        }

        // 初始化应用
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new VocabularyApp();
            window.app = app; // 暴露给全局，供完成页面使用
        });
    </script>

                                        <div>
                                            <div class="font-bold text-green-600">${totalWords}</div>
                                            <div class="text-xs">总单词数</div>
                                        </div>
                                        <div>
                                            <div class="font-bold text-purple-600">${avgAccuracy}%</div>
                                            <div class="text-xs">平均正确率</div>
                                        </div>
                                        <div>
                                            <div class="font-bold text-orange-600">${avgTime}s</div>
                                            <div class="text-xs">平均用时</div>
                                        </div>
                                    </div>
                                `;
                            }
                            
                            document.querySelector('#homeView .bg-gradient-to-r.from-green-50').appendChild(statsDiv);
                        });
                    </script>
                </div>

                <!-- 快捷操作提示 -->
                <div class="bg-yellow-50 rounded-xl p-3">
                    <div class="text-xs text-gray-600 text-center space-y-1">
                        <div><i class="fa fa-lightbulb-o mr-1 text-yellow-500"></i>操作提示</div>
                        <div class="flex justify-center space-x-4 text-xs">
                            <span>← 已会</span>
                            <span>空格 单词发音</span>
                            <span>E 例句发音</span>
                            <span>→ 不会</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 学习视图 -->
    <div id="learningView" class="min-h-screen flex items-center justify-center p-4 hidden">
        <div class="w-full max-w-3xl">
            <!-- 进度条 -->
            <div class="bg-white rounded-2xl p-4 mb-6 card-shadow">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-medium text-gray-600">学习进度</span>
                    <span id="progressText" class="text-sm font-bold text-blue-600">0/0</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                    <div id="progressBar" class="progress-bar bg-gradient-to-r from-green-400 to-blue-500 h-3 rounded-full transition-all duration-500 ease-in-out" style="width: 0%"></div>
                </div>
            </div>

            <!-- 单词卡片 -->
            <div id="wordCard" class="word-card bg-white rounded-3xl p-6 md:p-8 card-shadow animate-slide-in mb-6">
                <div class="text-center mb-6 relative">
                    <!-- 单词发音按钮 -->
                    <button id="pronounceWordBtn" 
                            class="pronunciation-btn absolute top-2 right-2 p-3 text-gray-400 hover:text-blue-500 rounded-full hover:bg-blue-50 transition-all duration-300 z-10">
                        <i class="fa fa-volume-off text-2xl"></i>
                    </button>
                    
                    <h2 id="currentWord" class="text-word font-bold text-gray-800 mb-3 text-shadow"></h2>
                    <p id="phonetic" class="text-phonetic text-blue-600 font-mono mb-4"></p>
                </div>
                
                <div class="space-y-6 text-left">
                    <div class="bg-blue-50 rounded-xl p-4 border-l-4 border-blue-400">
                        <h3 class="font-semibold text-gray-800 mb-2 flex items-center">
                            <i class="fa fa-book mr-2 text-blue-500"></i>含义
                        </h3>
                        <p id="meaning" class="text-meaning text-gray-700"></p>
                    </div>
                    
                    <div class="bg-green-50 rounded-xl p-4 border-l-4 border-green-400 relative">
                        <!-- 例句发音按钮 -->
                        <button id="pronounceExampleBtn" 
                                class="pronunciation-btn absolute top-3 right-3 p-2 text-gray-400 hover:text-green-500 rounded-full hover:bg-green-50 transition-all duration-300">
                            <i class="fa fa-volume-off text-xl"></i>
                        </button>
                        
                        <h3 class="font-semibold text-gray-800 mb-3 flex items-center">
                            <i class="fa fa-quote-left mr-2 text-green-500"></i>例句
                        </h3>
                        <p id="example" class="text-example text-gray-700 mb-3 leading-relaxed"></p>
                        <p id="translation" class="text-translation text-gray-600 bg-white rounded-lg p-3 shadow-sm"></p>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="flex space-x-4 mb-4">
                <button id="knowBtn" 
                        class="flex-1 bg-gradient-to-r from-green-400 to-green-600 text-white py-4 px-6 rounded-xl font-semibold text-lg btn-hover btn-shadow action-btn">
                    <i class="fa fa-check mr-2"></i>已会
                </button>
                <button id="unknownBtn" 
                        class="flex-1 bg-gradient-to-r from-red-400 to-red-600 text-white py-4 px-6 rounded-xl font-semibold text-lg btn-hover btn-shadow action-btn">
                    <i class="fa fa-times mr-2"></i>不会
                </button>
            </div>

            <!-- 操作提示 -->
            <div class="bg-gray-50 rounded-xl p-3 text-center">
                <div class="text-xs text-gray-500 space-y-1">
                    <div>快捷操作：</div>
                    <div class="flex justify-center space-x-6 text-xs">
                        <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded">← 已会</span>
                        <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded">空格 单词</span>
                        <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded">E 例句</span>
                        <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded">→ 不会</span>
                    </div>
                </div>
            </div>

            <!-- 返回按钮 -->
            <button id="backHomeBtn" 
                    class="w-full mt-4 text-gray-500 hover:text-gray-700 py-3 px-4 rounded-xl border border-gray-300 btn-hover">
                <i class="fa fa-arrow-left mr-2"></i>返回主页
            </button>
        </div>
    </div>

    <!-- 完成视图 -->
    <div id="completionView" class="min-h-screen flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-2xl w-full card-shadow animate-fade-in">
            <div class="text-center mb-8">
                <div class="w-24 h-24 bg-gradient-to-br from-yellow-400 via-orange-400 to-red-400 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg animate-bounce-gentle">
                    <i class="fa fa-trophy text-white text-4xl"></i>
                </div>
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2 text-shadow">学习完成！</h1>
                <p class="text-gray-600 text-lg">恭喜你完成了本次单词学习</p>
            </div>

            <!-- 学习统计 -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-gradient-to-br from-blue-50 to-blue-100 rounded-2xl p-4 text-center">
                    <div class="text-2xl md:text-3xl font-bold text-blue-600" id="totalWords">0</div>
                    <div class="text-sm text-gray-600 mt-1">总单词数</div>
                </div>
                <div class="bg-gradient-to-br from-green-50 to-green-100 rounded-2xl p-4 text-center">
                    <div class="text-2xl md:text-3xl font-bold text-green-600" id="knownWords">0</div>
                    <div class="text-sm text-gray-600 mt-1">已掌握</div>
                </div>
                <div class="bg-gradient-to-br from-red-50 to-red-100 rounded-2xl p-4 text-center">
                    <div class="text-2xl md:text-3xl font-bold text-red-600" id="unknownWords">0</div>
                    <div class="text-sm text-gray-600 mt-1">需复习</div>
                </div>
                <div class="bg-gradient-to-br from-purple-50 to-purple-100 rounded-2xl p-4 text-center">
                    <div class="text-2xl md:text-3xl font-bold text-purple-600" id="accuracy">0%</div>
                    <div class="text-sm text-gray-600 mt-1">正确率</div>
                </div>
            </div>

            <!-- 用时 -->
            <div class="bg-gradient-to-r from-yellow-50 to-orange-50 rounded-2xl p-4 mb-6 text-center">
                <div class="text-lg md:text-xl font-semibold text-orange-600" id="timeSpent">0分0秒</div>
                <div class="text-sm text-gray-600">学习用时</div>
            </div>

            <!-- 需复习单词 -->
            <div class="mb-8">
                <h3 class="font-semibold text-gray-800 mb-3 flex items-center">
                    <i class="fa fa-exclamation-triangle mr-2 text-orange-500"></i>需重点复习的单词
                </h3>
                <div id="unknownWordsList" class="max-h-48 overflow-y-auto bg-gray-50 rounded-xl p-3">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="flex space-x-4">
                <button id="restartBtn" 
                        class="flex-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 text-white py-4 px-6 rounded-xl font-semibold text-lg btn-hover btn-shadow action-btn">
                    <i class="fa fa-bullseye mr-2"></i>重新学习
                </button>
                <button id="backHomeBtn2" 
                        class="flex-1 bg-gradient-to-r from-gray-400 to-gray-600 text-white py-4 px-6 rounded-xl font-semibold text-lg btn-hover btn-shadow action-btn">
                    <i class="fa fa-home mr-2"></i>返回主页
                </button>
            </div>
        </div>
    </div>
</body>
</html>
